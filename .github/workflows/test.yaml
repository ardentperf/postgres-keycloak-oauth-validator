name: Integration Tests

on:
  push:
    branches:
      - main
      - 'x-ai/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: entra_validator integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate TLS certificates
        run: |
          mkdir -p test/certs
          # Use the container hostname "entra-test-oauth" as the SAN.
          # Docker's internal DNS resolves container names within the network,
          # so psql can reach the mock server as https://entra-test-oauth:8443
          openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
            -keyout test/certs/server.key \
            -out    test/certs/server.crt \
            -subj   "/CN=entra-test-oauth" \
            -addext "subjectAltName=DNS:entra-test-oauth,DNS:localhost"

      - name: Build validator
        run: |
          docker build \
            --target builder \
            -t entra-validator-builder \
            --build-arg PG_MAJOR=18 \
            -f docker/Dockerfile \
            .
          mkdir -p test/so
          docker create --name so-extractor entra-validator-builder /bin/true
          docker cp so-extractor:/srv/build/entra_validator.so test/so/entra_validator.so
          docker rm -f so-extractor

      - name: Build test images
        run: |
          docker build -t entra-mock-oauth -f test/Dockerfile.mock-server test/
          docker build -t entra-test-client -f test/Dockerfile.test-client test/

      - name: Create Docker network
        run: docker network create entra-test-net --driver bridge

      - name: Start mock OAuth server
        run: |
          docker run -d --name entra-test-oauth \
            --network entra-test-net \
            -v "${{ github.workspace }}/test/certs:/certs:ro" \
            -e MOCK_OAUTH_CERT=/certs/server.crt \
            -e MOCK_OAUTH_KEY=/certs/server.key \
            entra-mock-oauth 8443

          # Wait for readiness
          for i in $(seq 1 20); do
            if docker exec entra-test-oauth python3 -c \
              "import http.client, ssl; ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; c=http.client.HTTPSConnection('127.0.0.1',8443,context=ctx); c.request('GET','/healthz'); r=c.getresponse(); exit(0 if r.status==200 else 1)" 2>/dev/null; then
              echo "OAuth server ready"; break
            fi
            sleep 1
            [ $i -lt 20 ] || { echo "OAuth server timeout"; docker logs entra-test-oauth; exit 1; }
          done

      - name: Start PostgreSQL
        run: |
          # Use the container name as hostname — Docker DNS resolves it within the network
          OAUTH_ISSUER="https://entra-test-oauth:8443"
          echo "OAUTH_ISSUER=${OAUTH_ISSUER}" >> $GITHUB_ENV

          # Generate PG server cert (self-signed, for SSL)
          openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
            -keyout test/certs/pg.key \
            -out    test/certs/pg.crt \
            -subj   "/CN=postgres" 2>/dev/null

          # Use standard postgres:18 image (trixie, same ABI as builder)
          docker run -d --name entra-test-pg \
            --network entra-test-net \
            -e POSTGRES_PASSWORD=postgres \
            -v "${{ github.workspace }}/test/so/entra_validator.so:/usr/lib/postgresql/18/lib/entra_validator.so:ro" \
            -v "${{ github.workspace }}/test/certs/pg.crt:/tmp/pg-server.crt:ro" \
            -v "${{ github.workspace }}/test/certs/pg.key:/tmp/pg-server.key:ro" \
            postgres:18

          # Wait for readiness
          for i in $(seq 1 30); do
            if docker exec entra-test-pg pg_isready -U postgres 2>/dev/null; then break; fi
            sleep 1
            [ $i -lt 30 ] || { echo "PG timeout"; docker logs entra-test-pg; exit 1; }
          done

          # Fix SSL key permissions (must be owned by postgres, mode 600)
          docker exec entra-test-pg bash -c "
            cp /tmp/pg-server.key /var/lib/postgresql/pg-server.key
            chmod 600 /var/lib/postgresql/pg-server.key
            chown postgres /var/lib/postgresql/pg-server.key
          "

          # Write extra configuration (no leading whitespace — heredoc at col 0)
          cat > /tmp/pg-extra.conf <<'PGCONF'
oauth_validator_libraries = 'entra_validator'
entra.identity_claim = 'preferred_username'
entra.required_claim = 'roles'
entra.required_values = 'db_user,db_admin'
entra.debug = on
log_min_messages = debug1
ssl = on
ssl_cert_file = '/tmp/pg-server.crt'
ssl_key_file = '/var/lib/postgresql/pg-server.key'
PGCONF
          # Append issuer with runtime value.
          # Tests use the /param issuer so the mock server decodes claim overrides
          # from client_id. entra.expected_issuer must match the JWT iss claim.
          echo "entra.expected_issuer = '${OAUTH_ISSUER}/param'" >> /tmp/pg-extra.conf

          PGDATA=$(docker exec entra-test-pg psql -U postgres -tAc "SHOW data_directory;")
          echo "PGDATA=${PGDATA}" >> $GITHUB_ENV

          docker cp /tmp/pg-extra.conf entra-test-pg:/tmp/pg-extra.conf
          docker exec entra-test-pg bash -c "cat /tmp/pg-extra.conf >> ${PGDATA}/postgresql.conf"

          # Write pg_hba.conf (no leading whitespace)
          cat > /tmp/pg_hba.conf <<PGCONF
local all all trust
hostssl all all 0.0.0.0/0 oauth issuer="${OAUTH_ISSUER}/param" scope="openid" validator="entra_validator" map="entra"
host all all 0.0.0.0/0 trust
PGCONF
          docker cp /tmp/pg_hba.conf entra-test-pg:/tmp/pg_hba.conf
          docker exec entra-test-pg bash -c "cp /tmp/pg_hba.conf ${PGDATA}/pg_hba.conf"

          # Write pg_ident.conf (no leading whitespace)
          cat > /tmp/pg_ident.conf <<'PGCONF'
entra testuser@example.com testuser
entra testuser2@example.com testuser2
PGCONF
          docker cp /tmp/pg_ident.conf entra-test-pg:/tmp/pg_ident.conf
          docker exec entra-test-pg bash -c "cp /tmp/pg_ident.conf ${PGDATA}/pg_ident.conf"

          # Create roles and reload config
          docker exec entra-test-pg psql -U postgres -c \
            "CREATE USER testuser LOGIN; CREATE USER testuser2 LOGIN; SELECT pg_reload_conf();"

          PG_IP=$(docker inspect entra-test-pg --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          echo "PG_IP=${PG_IP}" >> $GITHUB_ENV

      - name: Run integration tests
        run: |
          mkdir -p test/logs
          # Install the mock server's cert into the system store so psql/libcurl trusts it
          docker run --rm \
            --network entra-test-net \
            -v "${{ github.workspace }}/test/certs/server.crt:/usr/local/share/ca-certificates/mock-oauth.crt:ro" \
            -e PGHOST="${{ env.PG_IP }}" \
            -e PGPORT=5432 \
            -e PGDATABASE=postgres \
            -e PGUSER=postgres \
            -e PGPASSWORD=postgres \
            -e OAUTH_ISSUER="${{ env.OAUTH_ISSUER }}" \
            --entrypoint bash \
            entra-test-client \
            -c "update-ca-certificates 2>/dev/null; /app/run_tests.sh" \
            2>&1 | tee test/logs/test-output.log

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p test/logs
          docker logs entra-test-pg   > test/logs/postgres.log   2>&1 || true
          docker logs entra-test-oauth > test/logs/oauth-server.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test/logs/

      - name: Cleanup
        if: always()
        run: |
          docker rm -f entra-test-pg entra-test-oauth 2>/dev/null || true
          docker network rm entra-test-net 2>/dev/null || true
