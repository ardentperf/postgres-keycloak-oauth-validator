name: Build and Push Image

on:
  push:
    branches:
      - main
      - 'x-ai/**'

jobs:
  build-push:
    name: Build and push entra_validator image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ardentperf/postgres-entra-oauth-validator:18-dev-trixie
            ghcr.io/ardentperf/postgres-entra-oauth-validator:latest
          build-args: |
            BASE=ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
            PG_MAJOR=18
