apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-oauth
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  instances: 1

  postgresql:
    extensions:
      - name: entra-validator
        ld_library_path:
          - system
        image:
          reference: ghcr.io/ardentperf/postgres-entra-oauth-validator:18-dev-trixie
    parameters:
      oauth_validator_libraries: "entra_validator"
      # Replace TENANT_ID with your Entra Directory (tenant) ID
      entra.expected_issuer: "https://login.microsoftonline.com/TENANT_ID/v2.0"
      # Use preferred_username (Entra UPN, e.g. user@domain.com) as the PG identity
      entra.identity_claim: "preferred_username"
      # Authorize users whose 'roles' array claim contains 'db_user' or 'db_admin'
      entra.required_claim: "roles"
      entra.required_values: "db_user,db_admin"
      entra.debug: "on"
    pg_hba:
      # OAuth device flow for human users
      # Replace TENANT_ID and APP_ID with your Entra values
      - hostssl all all 0.0.0.0/0 oauth issuer="https://login.microsoftonline.com/TENANT_ID/v2.0" scope="api://APP_ID/pg_access" validator="entra_validator"
    pg_ident:
      # Map Entra UPN (preferred_username) to PostgreSQL roles.
      # Example: user@company.com -> user_company_com
      # Add entries as needed for your users.
      # - entra alice@company.com alice
      # - entra bob@company.com bob
